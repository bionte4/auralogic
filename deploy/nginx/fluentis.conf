# Host Nginx in front of Docker. Apps listen on 127.0.0.1 only.
#
#   sudo cp deploy/nginx/fluentis.conf /etc/nginx/sites-available/fluentis.conf
#   sudo ln -s /etc/nginx/sites-available/fluentis.conf /etc/nginx/sites-enabled/fluentis.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Issue certificates after DNS points at this VPS, for example:
#   sudo certbot --nginx -d app.controldesk.site -d api.controldesk.site
#   sudo certbot --nginx -d fluentis.site -d api.fluentis.site
#
# Pick one pair. app.* / fluentis.site is the Next.js origin (FRONTEND_ORIGIN).
# api.* is NEXT_PUBLIC_API_URL without a trailing slash, plus /api.
# Same-site subdomains keep COOKIE_SAMESITE=lax. Set COOKIE_SECURE=true.

upstream fluentis_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream fluentis_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP — Certbot can attach the HTTPS redirect on these server names.
server {
    listen 80;
    listen [::]:80;
    server_name app.controldesk.site fluentis.site api.controldesk.site api.fluentis.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Next.js — use one hostname pair. Duplicate this block for the other domain
# and point ssl_certificate at that certbot directory (live/fluentis.site).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.controldesk.site;

    # Comment these two lines out until certbot has created the files.
    ssl_certificate     /etc/letsencrypt/live/app.controldesk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.controldesk.site/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://fluentis_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# NestJS. Global prefix is /api, so routes look like /api/health.
# For api.fluentis.site, copy this block and change server_name plus the cert path.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.controldesk.site;

    ssl_certificate     /etc/letsencrypt/live/api.controldesk.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.controldesk.site/privkey.pem;

    # Lesson uploads are capped at 20 MB by the API.
    client_max_body_size 25m;

    location / {
        proxy_pass http://fluentis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Certificate PDFs and payment webhooks can run longer than the default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
