# Host Nginx in front of Docker. Apps listen on 127.0.0.1 only.
#
#   sudo cp deploy/nginx/fluentis.conf /etc/nginx/sites-available/fluentis.conf
#   sudo ln -s /etc/nginx/sites-available/fluentis.conf /etc/nginx/sites-enabled/fluentis.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Issue certificates after DNS points at this VPS:
#   sudo certbot --nginx -d auralogic.web.id -d api.auralogic.web.id
#
# auralogic.web.id is the Next.js origin (FRONTEND_ORIGIN).
# api.auralogic.web.id is NEXT_PUBLIC_API_URL without a trailing slash, plus /api.
# Same-site subdomains keep COOKIE_SAMESITE=lax. Set COOKIE_SECURE=true.

upstream fluentis_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream fluentis_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# HTTP — Certbot can attach the HTTPS redirect on these server names.
server {
    listen 80;
    listen [::]:80;
    server_name auralogic.web.id api.auralogic.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Next.js. Comment the certificate lines out until certbot has created the files.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auralogic.web.id;

    ssl_certificate     /etc/letsencrypt/live/auralogic.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auralogic.web.id/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://fluentis_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# NestJS. Global prefix is /api, so routes look like /api/health.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.auralogic.web.id;

    ssl_certificate     /etc/letsencrypt/live/auralogic.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auralogic.web.id/privkey.pem;

    # Lesson uploads are capped at 20 MB by the API.
    client_max_body_size 25m;

    location / {
        proxy_pass http://fluentis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Certificate PDFs and payment webhooks can run longer than the default.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
