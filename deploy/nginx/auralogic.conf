# Host Nginx in front of Docker. Apps listen on 127.0.0.1 only.
#
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo cp deploy/nginx/auralogic.conf /etc/nginx/sites-available/auralogic.conf
#   sudo ln -sf /etc/nginx/sites-available/auralogic.conf /etc/nginx/sites-enabled/auralogic.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# After the apps answer on port 80, Certbot adds HTTPS:
#   sudo certbot --nginx -d auralogic.web.id -d api.auralogic.web.id
#
# auralogic.web.id is the Next.js origin (FRONTEND_ORIGIN).
# api.auralogic.web.id is NEXT_PUBLIC_API_URL without a trailing slash, plus /api.

upstream auralogic_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream auralogic_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name auralogic.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 25m;

    location / {
        proxy_pass http://auralogic_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.auralogic.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 25m;

    location / {
        proxy_pass http://auralogic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
